# Identical grid to sweep_draem_split.yaml. A version of its own, because
# resume identity is (tags, params) and includes neither the synthetic root nor the split:
# under v0_ablate these runs would look complete already. v3_ablate: the v3 corpus, capped at
# 60 defects, on the split whose pools skip make_split.sh's first 10 frames.
category: [bottle, cable, capsule, carpet, grid, hazelnut, leather, metal_nut, pill, screw, tile, toothbrush, transistor, wood, zipper]
version: [v3_ablate]
model.backbone: [wide_resnet50_2, dinov3_vitl16, dinov3_vits16, resnet18]
model.layers: [default]
data.image_size: [[256,256]]
# model.embed_dimension_factor: [1.0, 0.75]

model.coreset_sampling_ratio: [0.1,0.2]
data.num_train_samples: [1,2,4,8]
seed: [42, 6800, 9999]
