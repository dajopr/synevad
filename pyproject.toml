[project]
name = "synpic-hitl"
version = "0.1.0"
description = "Severity-graded synthetic anomalies as a model-selection proxy for anomaly detection"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "pillow>=10.0",
    "diffusers>=0.37.1",
    "bitsandbytes>=0.45.0",
    "torch>=2.12.0",
    "matplotlib>=3.10.9",
    "accelerate>=1.13.0",
    "torchvision>=0.27.0",
    "omegaconf>=2.3.1",
    "faiss-gpu>=1.14.3",
    "python-dotenv>=1.2.2",
    "timm>=1.0.28",
    "scipy>=1.18.0",
    "scikit-learn>=1.9.0",
    "pandas>=2.2",
    "mlflow>=3.14.0",
    "scikit-image>=0.26.0",
    "editreward",
    "patchcore",
    "transformers>=5.0",
]

[tool.uv]
# EditReward pins transformers below 5; we override rather than drop the dep. Load-time
# shims in `synevad.synthesis.editreward` cover the 5.x gaps (removed trainer symbols,
# `use_cache` forwarded into `__init__`, nested `text_config.hidden_size`, vision at
# `model.visual`).
# `faiss-cpu`, `pretrainedmodels` and `click` are in patchcore-inspection's
# requirements.txt but imported by nothing under its `src/patchcore`. faiss-cpu is the
# one that matters: it ships the same top-level `faiss` module as the `faiss-gpu` we
# install, so resolving both leaves whichever landed last. An always-false marker is how
# uv drops a requirement, since an override replaces it whole.
override-dependencies = [
    "transformers>=5.0",
    "faiss-cpu; sys_platform == 'never'",
    "pretrainedmodels; sys_platform == 'never'",
    "click; sys_platform == 'never'",
]

[tool.uv.sources]
editreward = { git = "https://github.com/TIGER-AI-Lab/EditReward.git" }
# PatchCore is the detector every arm is scored with. Upstream publishes no release, so
# the commit is pinned: a different one silently changes the numbers.
patchcore = { git = "https://github.com/amazon-science/patchcore-inspection.git", rev = "fcaa92f124fb1ad74a7acf56726decd4b27cbcad" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synevad"]
